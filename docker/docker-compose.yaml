services:
  ollama:
    build:
      context: ..
      target: ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ..
      target: api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:0.8b
      DATABASE_PATH: /app/data/cache.sqlite3
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-900}
    volumes:
      - cache-data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  cache-data:
